name: Build and Export Docker Image
on:
  push:
    branches: [main, master]
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-docker.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.split.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and compress image
        run: |
          docker build -t omnimrz-paddleocr:latest .
          docker save omnimrz-paddleocr:latest -o omnimrz-paddleocr.tar
          gzip -c omnimrz-paddleocr.tar > omnimrz-paddleocr.tar.gz
          rm -f omnimrz-paddleocr.tar
          ls -lh omnimrz-paddleocr.tar.gz
      - name: Split into 1GB chunks
        id: split
        run: |
          split -b 1G omnimrz-paddleocr.tar.gz chunk.
          rm -f omnimrz-paddleocr.tar.gz
          ls -lh chunk.*
          files=$(ls chunk.* | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "files=$files" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: all-chunks
          path: chunk.*
          compression-level: 0
          retention-days: 1
  upload-chunks:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file: ${{ fromJson(needs.build.outputs.files) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: all-chunks
      - uses: actions/upload-artifact@v4
        with:
          name: docker-part-${{ matrix.file }}
          path: ${{ matrix.file }}
          compression-level: 0
          retention-days: 7
